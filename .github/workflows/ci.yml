name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT actions/setup-python: pyautogui's `mouseinfo`
      # dependency needs a real tkinter binding, and that only exists if
      # python3-tk is installed for the *same* interpreter build it runs
      # against. actions/setup-python's prebuilt CPython has no matching
      # apt package (same failure mode as python:slim base images — see
      # Dockerfile). Using Ubuntu's own apt python3 + apt python3-tk keeps
      # this consistent with both the Dockerfile and local dev setup.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-tk python3-dev build-essential \
            xvfb x11-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      # --system-site-packages so the apt python3-tk stays importable (see
      # Dockerfile). --frozen fails the build if uv.lock is out of sync with
      # pyproject.toml, rather than silently resolving something else.
      - name: Install Python dependencies
        run: |
          uv venv --system-site-packages --python /usr/bin/python3
          uv sync --frozen --group dev

      - name: Ruff
        run: uv run --frozen ruff check .

      - name: Bandit
        run: uv run --frozen bandit -c pyproject.toml -r src/ main.py docker/

      # Known CVEs in the resolved dependency tree. Advisories appear between
      # releases, so this runs against the lockfile on every build rather
      # than only when dependencies change.
      # Audits the exported lockfile, not the live environment: the venv is
      # created with --system-site-packages, so an environment audit also
      # picks up Ubuntu's own python3-apt, which has no PyPI entry and
      # aborts the run with "dependency not found on PyPI".
      - name: pip-audit (dependency CVEs)
        run: uv run --frozen pip-audit -r requirements.txt --desc

      - name: Tests (with coverage)
        env:
          GEMINI_API_KEY: dummy-for-ci
        run: |
          xvfb-run -a uv run --frozen pytest tests/ \
            --cov=src --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=88

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image (build-only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: workflow-automation-bot:ci
