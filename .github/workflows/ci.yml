name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT actions/setup-python: pyautogui's `mouseinfo`
      # dependency needs a real tkinter binding, and that only exists if
      # python3-tk is installed for the *same* interpreter build it runs
      # against. actions/setup-python's prebuilt CPython has no matching
      # apt package (same failure mode as python:slim base images — see
      # Dockerfile). Using Ubuntu's own apt python3 + apt python3-tk keeps
      # this consistent with both the Dockerfile and local dev setup.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-tk python3-dev build-essential \
            xvfb x11-utils

      - name: Create venv and install Python dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Bandit
        run: |
          . .venv/bin/activate
          bandit -c pyproject.toml -r src/ main.py docker/

      - name: Tests (with coverage)
        env:
          GEMINI_API_KEY: dummy-for-ci
        run: |
          . .venv/bin/activate
          xvfb-run -a python3 -m pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image (build-only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: workflow-automation-bot:ci
