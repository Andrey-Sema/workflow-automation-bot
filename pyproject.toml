[project]
name = "workflow-automation-bot"
version = "3.0.0"
description = "AI-powered funeral service order digitization pipeline with Telegram control panel and RDP-based 1C data entry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Runtime dependencies for the Docker/Linux deployment (bot + AI pipeline +
# in-container RDP automation). Windows-only calibration tooling under
# tools/ has its own requirements file — see tools/requirements-windows.txt.
dependencies = [
    "python-dotenv==1.2.2",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",

    # --- AI ---
    "google-genai==1.75.0",

    # --- Image / PDF processing ---
    "pillow==12.3.0",
    "PyMuPDF==1.27.2.2",

    # --- Screen automation (low-level 1C input; runs against the
    # in-container Xvfb display that FreeRDP renders the remote desktop
    # onto) ---
    "PyAutoGUI==0.9.54",
    "pyperclip==1.11.0",
    # Required for PyAutoGUI/PyScreeze's `confidence=` kwarg (fuzzy template
    # matching, tolerates a few pixels of RDP rendering difference) - without
    # this, passing confidence=... raises NotImplementedError at runtime and
    # every real 1C tab switch fails. -headless: no GTK/libGL dependency, so
    # it installs cleanly on the minimal ubuntu:24.04 image without extra apt
    # packages (confirmed: its manylinux wheel vendors everything except libc).
    "opencv-python-headless==4.12.0.88",

    # --- Telegram bot ---
    "aiogram==3.30.0",
    "aiosqlite==0.22.1",

    # --- Metrics (Prometheus) ---
    # aiohttp is already an aiogram dependency; pinned explicitly since
    # src/telegram_bot/metrics_server.py imports it directly.
    "aiohttp==3.14.3",
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.151.9",

    "ruff==0.16.1",
    "bandit==1.9.4",
    # Dependency vulnerability scanning against the resolved lockfile.
    "pip-audit==2.9.0",
]

[tool.uv]
# The venv must be created with --system-site-packages (see Dockerfile and
# README): pyautogui imports mouseinfo, which hard-requires a real tkinter
# binding, and apt's python3-tk only matches the interpreter build it was
# compiled against. uv must therefore not wipe those system packages.
#
# Python is NOT downloaded by uv for the same reason — a uv-managed CPython
# has no matching python3-tk, exactly like python:3.x-slim. Always resolve
# against the OS interpreter.
python-downloads = "never"
python-preference = "only-system"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
# win_1c_bot.py is the proven, hand-tuned low-level 1C/RDP input primitive —
# deliberately excluded so no autofix ever touches it, even cosmetically.
extend-exclude = ["tools", ".venv", "data", "src/win_1c_bot.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess call review handled manually (RDP entrypoint)
    "S607",   # partial-path process invocation (docker entrypoint uses PATH by design)
    "RUF001", # ambiguous-unicode-character-string: codebase is Cyrillic (RU/UA) by design
    "RUF002", # same, in docstrings
    "RUF003", # same, in comments
]

[tool.ruff.lint.per-file-ignores]
# S108: tests use "/tmp/..." strings as fake photo paths (never actually
# written to) to exercise handler logic without touching the real filesystem.
"tests/*" = ["S101", "S105", "S106", "S311", "S108"]
"tools/*" = ["S", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "tools", "data"]
# B101: assert is fine outside tests too (none currently outside tests, kept for parity with ruff config)
# B603/B607: docker/entrypoint.py subprocess calls use fixed argv lists (never shell=True)
# and rely on PATH for standard system binaries (Xvfb, xfreerdp3, ...) by design.
skips = ["B101", "B603", "B607", "B404"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/telegram_bot/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
